<!DOCTYPE html>
<!-- 小泰空位儀表板 v5.3 -->
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>小泰空位儀表板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  /* 溫潤陶土・小泰空品牌暖棕調（白天明亮，但整體更棕更暖）*/
  --cream:#F8F2EE;--clay:#AE6C56;--cocoa:#91563E;--gold:#C9963C;--sand:#D1CBBF;
  --bg:#F4ECE3;--bg2:#EADFD1;--bg3:#F0E7DC;--line:#E0D4C4;--line2:#E7DDCE;
  --black:#3E2A21;--gray:#8b7d6b;--gray2:#b3a58f;--gray3:#cbbca6;
  /* 卡片頭統一色（深可可）＋卡片亮面 */
  --header:#91563E;--card:#FCF8F3;--card-bdr:#E4D8C7;
  /* 通知/提醒紅：品牌莓陶紅 */
  --red:#C24D3F;--red-bg:rgba(194,77,63,.07);--red-bdr:rgba(194,77,63,.2);
  /* 狀態綠：品牌暖綠 */
  --green:#5C7A50;
  /* 分店識別色（南京三民＝深松綠；中山＝棗磚紅）*/
  --nj:#4E5D3E;--nj-bg:rgba(78,93,62,.10);--nj-bdr:rgba(78,93,62,.30);
  --zs:#96382E;--zs-bg:rgba(150,56,46,.10);--zs-bdr:rgba(150,56,46,.30);
  /* 老師膠囊：正規＝陶土棕、培訓＝橄欖綠（同大地色系、和諧可辨）*/
  --pill-reg:#AE6C56;--pill-reg-bg:rgba(174,108,86,.10);--pill-reg-bdr:rgba(174,108,86,.42);
  --pill-tr:#6E7B4E;--pill-tr-bg:rgba(110,123,78,.12);--pill-tr-bdr:rgba(110,123,78,.46);
  --d120:#C4857A;--d120-bg:rgba(196,133,122,.10);--d120-bdr:rgba(196,133,122,.28);
  --d90:#A8906E; --d90-bg:rgba(168,144,110,.10); --d90-bdr:rgba(168,144,110,.28);
  --d60:#D4A882; --d60-bg:rgba(212,168,130,.10); --d60-bdr:rgba(212,168,130,.28);
  --tr:#ADC99A;--tr-dark:#6E7B4E;--tr-bg:rgba(110,123,78,.12);--tr-bdr:rgba(110,123,78,.42);--tr-text:#5A6640;
}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'Noto Sans TC',sans-serif;color:var(--black)}
.app{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto;background:var(--bg)}
.handle{flex-shrink:0;padding:5px 0 0;display:flex;justify-content:center}
.handle-bar{width:28px;height:3px;background:var(--line);border-radius:2px}
.hd{flex-shrink:0;padding:4px 14px 5px;position:relative}
.hd-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:4px}
.hd-name{font-size:11px;color:var(--gray);flex:1;min-width:0;line-height:1.45}
.hd-sub{font-size:9px;color:var(--gray2);letter-spacing:.01em}
.hd-sub a{color:inherit;text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:.5px}
.hd-live{display:inline-flex;align-items:center;gap:5px;flex-shrink:0;font-family:'DM Mono',monospace;font-size:10px;color:var(--green);cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;padding:6px 8px;margin:-6px -8px;border:none;background:transparent;border-radius:7px;touch-action:manipulation}
.hd-live:active{opacity:.55}
.stats-sheet{max-height:88%;overflow-y:auto}
.stx-head{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px}
.stx-title{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;color:var(--gray2)}
.stx-x{font-size:15px;color:var(--gray2);cursor:pointer;line-height:1;padding:4px 8px;margin:-4px -8px}
.stx-visitors{display:flex;gap:18px;padding:1px 2px 8px;border-bottom:1px solid var(--line2)}
.stx-vis{display:flex;align-items:baseline;gap:6px}
.stx-vis .l{font-size:10px;color:var(--gray2)}
.stx-vis .n{font-family:'DM Mono',monospace;font-size:13px;font-weight:400;color:var(--gray);letter-spacing:.02em}
.stx-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:6px 2px;border-bottom:1px solid var(--line2)}
.stx-row .k{font-size:10px;color:var(--gray2)}
.stx-row .v{font-family:'DM Mono',monospace;font-size:10px;color:var(--gray);white-space:nowrap}
.stx-row .v i{color:var(--gray3);font-style:normal}
.stx-faint{margin-top:7px}
.stx-frow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:3px 2px}
.stx-frow .k{font-size:9px;color:var(--gray3)}
.stx-frow .v{font-family:'DM Mono',monospace;font-size:9px;color:var(--gray3);white-space:nowrap}
.stx-admin{text-align:right;margin-top:10px}
.stx-admin a{font-family:'DM Mono',monospace;font-size:9px;color:var(--gray3);cursor:pointer;letter-spacing:.05em;padding:4px}
.stx-pw{display:none;align-items:center;justify-content:flex-end;gap:6px;margin-top:10px}
.stx-pw.show{display:flex}
.stx-pw input{width:120px;height:32px;border:1px solid var(--line);border-radius:7px;background:var(--bg3);padding:0 9px;font-family:'DM Mono',monospace;font-size:13px;color:var(--black);outline:none}
.stx-pw input:focus{border-color:var(--clay)}
.stx-pw button{height:32px;padding:0 12px;border:1px solid #7d4a37;border-radius:7px;background:var(--cocoa);color:var(--cream);font-family:'Noto Sans TC',sans-serif;font-size:12px;font-weight:500;cursor:pointer}
.stx-rank{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.stx-rank.show{display:block}
.stx-rank-t{font-size:10px;color:var(--gray);margin-bottom:6px}
.stx-rk{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:4px 2px;border-bottom:1px solid var(--line2);font-size:11px}
.stx-rk:last-child{border-bottom:none}
.stx-rk .nm{color:#6b5d4d}
.stx-rk .nm b{font-family:'DM Mono',monospace;color:var(--gray3);font-weight:400;margin-right:6px;font-size:9px}
.stx-rk .c{font-family:'DM Mono',monospace;color:#7a6a58;white-space:nowrap;font-size:10px}
.stx-rk .c i{color:var(--gray3);font-style:normal}
.sb-load{font-family:'Noto Sans TC',sans-serif;font-size:12px;color:var(--gray2);padding:10px 2px}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:livepulse 2.5s ease-in-out infinite}
@keyframes livepulse{0%,100%{opacity:1}50%{opacity:.2}}
.tabs{display:flex;background:var(--bg2);border-radius:7px;padding:2px;gap:2px;box-shadow:inset 0 1px 2px rgba(62,42,33,.13)}
.tab{flex:1;padding:4px 0;border:none;background:transparent;font-family:'Noto Sans TC',sans-serif;font-size:12px;color:var(--gray);border-radius:5px;cursor:pointer;transition:all .15s}
.tab.active{background:var(--card);color:var(--black);font-weight:500;box-shadow:0 1px 2px rgba(62,42,33,.18),inset 0 1px 0 rgba(255,255,255,.75)}
.filters{flex-shrink:0;border-bottom:1px solid var(--line2);background:var(--bg3);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
/* 分店＋時長：一列五個勾選框（左分店、右時長，中間分隔）*/
.filter-row{display:flex;align-items:stretch;gap:5px;padding:4px 12px 5px}
.cbx{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:4px;padding:4px 3px;border-radius:6px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;transition:all .15s;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 1px 1px rgba(62,42,33,.07)}
.cbx.on{box-shadow:inset 0 1px 2px rgba(62,42,33,.17)}
.cbx:active{transform:scale(.97)}
.cbx-box{width:12px;height:12px;border-radius:3px;border:1.5px solid #cdc4b8;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.cbx-check{display:none}
.cbx.on .cbx-check{display:block}
.cbx-label{font-size:11px;color:#a79d8f;line-height:1;white-space:nowrap;transition:color .15s}
.cbx-dur .cbx-label{font-family:'DM Mono',monospace;font-size:10px}
.cbx-branch{flex:1.2 1 0}
.cbx-locked{opacity:.38;pointer-events:none}
.cbx-sep{width:1px;background:var(--line);flex-shrink:0;margin:3px 3px;align-self:stretch}
/* 分店 on 狀態（品牌分店色）*/
.cbx-branch[data-branch="南京三民"].on{border-color:var(--nj);background:var(--nj-bg)}
.cbx-branch[data-branch="南京三民"].on .cbx-box{border-color:var(--nj);background:var(--nj)}
.cbx-branch[data-branch="南京三民"].on .cbx-label{color:var(--nj);font-weight:500}
.cbx-branch[data-branch="中山"].on{border-color:var(--zs);background:var(--zs-bg)}
.cbx-branch[data-branch="中山"].on .cbx-box{border-color:var(--zs);background:var(--zs)}
.cbx-branch[data-branch="中山"].on .cbx-label{color:var(--zs);font-weight:500}
/* 時長 on 狀態 */
.cbx-dur.d120.on{border-color:var(--d120);background:var(--d120-bg)}
.cbx-dur.d120.on .cbx-box{border-color:var(--d120);background:var(--d120)}
.cbx-dur.d120.on .cbx-label{color:var(--d120);font-weight:500}
.cbx-dur.d90.on{border-color:var(--d90);background:var(--d90-bg)}
.cbx-dur.d90.on .cbx-box{border-color:var(--d90);background:var(--d90)}
.cbx-dur.d90.on .cbx-label{color:var(--d90);font-weight:500}
.cbx-dur.d60.on{border-color:var(--d60);background:var(--d60-bg)}
.cbx-dur.d60.on .cbx-box{border-color:var(--d60);background:var(--d60)}
.cbx-dur.d60.on .cbx-label{color:var(--d60);font-weight:500}
.body{flex:1;overflow:hidden;position:relative}
.pane{position:absolute;inset:0;overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .15s;padding-bottom:6px}
.pane.active{opacity:1;pointer-events:all}
.pane::-webkit-scrollbar{display:none}
.status-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 12px;padding:5px 11px;background:var(--bg2);border:1px solid var(--line2);border-radius:7px}
.status-bar{display:flex;align-items:center;gap:6px;padding:6px 14px 4px}
.status-row .status-bar{padding:0;flex:1;min-width:0}
.status-row .sec-label{padding:0;flex-shrink:0;text-align:right;white-space:nowrap}
.status-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;transform:translateY(1.5px)}
.status-text{font-size:13px;font-weight:500;line-height:1.1}
.status-line{flex:1;min-width:0}
.status-caret{display:inline-block;width:9px;height:2px;margin-left:1px;border-radius:1px;vertical-align:baseline;transition:opacity .45s ease;animation:caretblink 1.05s step-end infinite}
.status-caret.frozen{animation:none;opacity:0}
@keyframes caretblink{0%,50%{opacity:1}51%,100%{opacity:0}}
.sec-label{font-family:'DM Mono',monospace;font-size:9px;color:var(--gray2);letter-spacing:.07em;padding:0 14px 5px}
.card-row{display:flex;gap:6px;padding:0 12px}
.card{flex:1 1 0;min-width:0;cursor:pointer}
.card-inner{height:156px;background:var(--card);border:1px solid var(--card-bdr);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;transition:background .12s;position:relative;box-shadow:0 1px 2px rgba(62,42,33,.14),inset 0 1px 0 rgba(255,255,255,.5)}
.card-inner:active{background:#f3ebe0}
.card-teacher-banner{flex-shrink:0;height:23px;padding:0 7px;display:flex;align-items:center;justify-content:space-between;gap:5px;background:var(--header)}
.banner-left{display:flex;align-items:center;gap:5px;min-width:0}
.card-hd-av{width:17px;height:17px;border-radius:50%;object-fit:cover;flex-shrink:0;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4)}
.card-teacher-name{font-size:10.5px;font-weight:500;color:var(--cream);letter-spacing:.01em;line-height:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.banner-right{display:flex;align-items:center;gap:4px;flex-shrink:0}
.card-rank{font-family:'DM Mono',monospace;font-size:9px;color:rgba(255,255,255,.6)}
.trainee-badge{font-family:'Noto Sans TC',sans-serif;font-size:7px;font-weight:500;padding:1px 3px;border-radius:2px;background:rgba(255,255,255,.20);color:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.28);line-height:1.5;white-space:nowrap;flex-shrink:0;}
.card-body{flex:1;padding:4px 7px 4px;display:flex;flex-direction:column;background:var(--card)}
.card-near-row{display:flex;align-items:center;gap:4px;margin-bottom:5px;flex-shrink:0}
.card-branch-banner{flex-shrink:0;text-align:center;font-family:'Noto Sans TC',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.06em;line-height:1.5;padding:2px 6px}
.card-branch-banner.bc-nj{background:#E3DED3;color:var(--nj);border-bottom:1px solid var(--nj-bdr)}
.card-branch-banner.bc-zs{background:#EBDAD1;color:var(--zs);border-bottom:1px solid var(--zs-bdr)}
.near-badge{font-family:'DM Mono',monospace;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;line-height:1.6}
.near-badge.today{background:var(--black);color:#fff}
.near-badge.other{background:#e7ddce;color:#6b5d4d}
.branch-chip{font-family:'Noto Sans TC',sans-serif;font-size:8px;font-weight:500;padding:1px 4px;border-radius:3px;line-height:1.5;background:#fff;border:1px solid #ddd;color:#888;white-space:nowrap}
.branch-chip.bc-nj{color:var(--nj);border-color:var(--nj-bdr);background:var(--nj-bg)}
.branch-chip.bc-zs{color:var(--zs);border-color:var(--zs-bdr);background:var(--zs-bg)}
.full-badge{font-family:'DM Mono',monospace;font-size:8.5px;font-weight:500;padding:1px 4px;border-radius:3px;line-height:1.5;background:var(--red-bg);border:1px solid var(--red-bdr);color:var(--red)}
.card-when{display:flex;align-items:center;gap:7px;margin-bottom:5px;flex-shrink:0}
.card-date{display:flex;flex-direction:column;line-height:1.12}
.card-mmdd{font-family:'DM Mono',monospace;font-size:11px;font-weight:500;color:#6b5240}
.card-wd{font-family:'DM Mono',monospace;font-size:9.5px;color:var(--gray)}
.card-time{font-family:'DM Mono',monospace;font-size:24px;font-weight:500;color:var(--black);letter-spacing:-1px;line-height:.95}
.card-div{height:1px;background:var(--line);flex-shrink:0;margin-bottom:5px}
.card-durs{display:flex;flex-wrap:wrap;gap:4px;flex:1;align-content:flex-start;overflow:hidden}
.dur-pill{font-family:'DM Mono',monospace;font-size:9px;font-weight:500;padding:1px 5px;border-radius:3px;line-height:1.6;white-space:nowrap;display:inline-block}
.dur-pill.d120{color:var(--d120);background:rgba(196,133,122,.13);border:1px solid var(--d120-bdr)}
.dur-pill.d90 {color:var(--d90); background:rgba(168,144,110,.13);border:1px solid var(--d90-bdr)}
.dur-pill.d60 {color:var(--d60); background:rgba(212,168,130,.13);border:1px solid var(--d60-bdr)}
.card-empty{flex:1 1 0;min-width:0}
.card-empty-inner{height:156px;border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center}
.card-empty-line{width:14px;height:1px;background:var(--line)}
.card-skeleton .card-inner{cursor:default}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.skel-banner{height:26px;background:linear-gradient(90deg,#e8e8e8 25%,#f0f0f0 50%,#e8e8e8 75%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite;flex-shrink:0}
.skel-line{border-radius:3px;background:linear-gradient(90deg,#e8e8e8 25%,#f0f0f0 50%,#e8e8e8 75%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes flipin{from{opacity:0;transform:perspective(500px) rotateY(-70deg)}to{opacity:1;transform:perspective(500px) rotateY(0deg)}}
.flip-1{animation:flipin .4s cubic-bezier(.4,0,.2,1) both}
.flip-2{animation:flipin .4s cubic-bezier(.4,0,.2,1) .11s both}
.flip-3{animation:flipin .4s cubic-bezier(.4,0,.2,1) .22s both}
@keyframes spin{to{transform:rotate(360deg)}}
.scan-spin{width:34px;height:34px;border-radius:50%;border:2.5px solid rgba(174,108,86,.16);border-top-color:var(--clay);animation:spin .85s linear infinite;flex-shrink:0}
.stab-group-wrap{flex-shrink:0;display:flex;align-items:center;padding:5px 14px;overflow-x:auto;scrollbar-width:none;background:var(--bg3);border-bottom:1px solid var(--line2);box-shadow:inset 0 1px 2px rgba(62,42,33,.07)}
.stab-group-wrap::-webkit-scrollbar{display:none}
.stab-group{flex-shrink:0;display:flex;align-items:center}
.stab-group-label{flex-shrink:0;display:inline-flex;align-items:center;gap:4px;font-family:'DM Mono',monospace;font-size:8.5px;color:var(--gray);letter-spacing:.04em;background:var(--bg2);border:1px solid var(--line);padding:3px 7px;border-radius:4px;white-space:nowrap;align-self:center;line-height:1.4;margin-right:6px;cursor:pointer;transition:background .12s,color .12s;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.stab-group-label:active{background:var(--bg3)}
.stab-group.collapsed .stab-group-label{color:var(--gray2)}
.stab-group-count{font-family:'DM Mono',monospace;font-size:8px;color:var(--gray2);letter-spacing:0}
.stab-group:not(.collapsed) .stab-group-count{display:none}
.stab-facepile{display:none;align-items:center;margin-left:2px}
.stab-group.collapsed .stab-facepile{display:inline-flex}
.stab-facepile img{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--bg2);margin-left:-5px;object-fit:cover;background:#e8e8e8}
.stab-facepile img:first-child{margin-left:1px}
.stab-group-pills{display:grid;grid-template-columns:1fr;transition:grid-template-columns .6s cubic-bezier(.37,0,.24,1),opacity .42s ease}
.stab-pills-inner{display:flex;align-items:center;overflow:hidden;min-width:0;padding:4px 0;margin:-4px 0}
.stab-group.collapsed .stab-group-pills{grid-template-columns:0fr;opacity:0}
.stab-divider{flex-shrink:0;width:1px;height:24px;background:var(--line);margin:0 8px;align-self:center}
.stab{flex-shrink:0;display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 4px;border-radius:20px;border:1px solid transparent;background:transparent;font-family:'Noto Sans TC',sans-serif;font-size:11px;color:var(--gray);cursor:pointer;transition:all .13s;white-space:nowrap;margin-right:5px;box-shadow:none}
.stab:last-child{margin-right:0}
.stab-av{width:18px;height:18px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#e8e8e8;filter:grayscale(.9);opacity:.5;transition:filter .15s,opacity .15s,box-shadow .15s}
.stab.active .stab-av{filter:none;opacity:1;box-shadow:0 0 0 1.5px rgba(62,42,33,.10)}
.stab.active{background:var(--card);border-color:var(--card);color:var(--black);font-weight:500;box-shadow:0 1px 2px rgba(62,42,33,.18),inset 0 1px 0 rgba(255,255,255,.75)}
.stab-tr-tag{font-family:'Noto Sans TC',sans-serif;font-size:7.5px;font-weight:500;line-height:1.6;padding:1px 4px;border-radius:2px;margin-left:3px;flex-shrink:0;white-space:nowrap;background:rgba(174,108,86,.13);color:var(--clay);border:1px solid rgba(174,108,86,.30)}
.stab.active .stab-tr-tag{background:rgba(174,108,86,.14);color:var(--clay);border-color:rgba(174,108,86,.32)}
.footer{flex-shrink:0;padding:5px 14px max(5px,env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bg)}
.ft-note{font-size:9.5px;color:var(--gray2);line-height:1.5;flex:1}
.ft-disc{font-family:'DM Mono',monospace;font-size:10px;color:var(--red);cursor:pointer;text-decoration:underline;text-underline-offset:3px;flex-shrink:0}
.mask{position:fixed;inset:0;background:rgba(62,42,33,.30);display:flex;align-items:flex-end;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .18s}
.mask.show{opacity:1;pointer-events:all}

<script>
// v3：前端直連客立樂 API（客立樂 WAF 會擋 Cloudflare Worker 的 POST，
//     但瀏覽器直連完全正常且 CORS 開放，所以不再經過 worker）
const BOOKING_CODE = 'a33MS6uxvrwXxin2jHTk4N';
const API_BASE     = 'https://booking-api.qlieer.app';
const LIFF_ID = '2009610906-9zraEtAy';
const LIFF_BOOKING = 'https://liff.line.me/2007603682-rDEPkdA2/a33MS6uxvrwXxin2jHTk4N';
const BRANCHES     = ['南京三民', '中山'];
const CACHE_TTL_MS = 4 * 60 * 1000; // 4 分鐘（localStorage 快取）
const WINDOW_DAYS_1 = 7;   // 開場先問最近 7 天
const WINDOW_DAYS_2 = 14;  // 7 天內沒空位的老師，再延長問到 14 天
const FETCH_CONCURRENCY = 6;      // 同時最多 6 支請求
const FETCH_JITTER = [60, 120];   // 每支之間間隔 60–120ms（含隨機抖動）
const WD = ['日','一','二','三','四','五','六'];
const BRANCH_SHORT = { '南京三民':'南京三民', '中山':'中山' }; // 南京三民為整體，不簡稱
const BRANCH_MAP = {
  '南京三民':'https://maps.app.goo.gl/i3ZkLhMTygNhrhEs7',
  '中山':'https://maps.app.goo.gl/KhFGBErcJSEoDF3f7',
};
const TEACHER_COLOR = {
  '令 Ling':'#6B7A8D','曜 Yao':'#7A6B6B','澈 Che':'#5C7A6E',
  '源 Yuan':'#7A6B52','鍛 Duan':'#6B5C7A','書 Shu':'#7A6B5C',
  '柏 Bo':'#5C6B7A','獺 Ta':'#7A5C6B','悟 Wu':'#5C6E7A',
  '沐 Mu':'#6E7A5C','椰 Ye':'#5C7A62','寧 Ning':'#7A755C',
};
const DUR_CONFIG = {
  120:{ cls:'d120', short:'120min', full:'120min 泰空經典' },
  90: { cls:'d90',  short:'90min',  full:'90min 泰空調和'  },
  60: { cls:'d60',  short:'60min',  full:'60min 泰空輕行'  },
};
let selectedDurs     = [120, 90, 60];
let selectedBranches = ['南京三民', '中山'];   // 兩間都選＝全部
let roster           = [];   // 從客立樂選單動態解析
let allData          = null; // { slots, roster, fetchedAt }
let staffPicked      = []; // 指定老師模式：多選（最多 3 位，FIFO）
let todayStaff       = new Set(); // 今日模式：老師多選（預設全選）
let currentTab       = 'today';
let sheetSlot        = null;
const tabSlots       = { today: [], staff: [] };
// ── Step 2 分段抓取用 ──
let CATALOG      = [];  // 老師清單（含 jobs）
let GROUPED      = {};  // key staffId__branch__dateKey__time -> slot（含 durations[]）
let FETCHED      = {};  // key `${staffId}:${dur}` -> 已抓到的天數(7/14)
let teacherDays  = {};  // staffId -> 該老師資料所在的視窗天數(7/14)
let refreshSeq   = 0;   // 防止非同步補資料時的過時渲染
let userDurs     = [120, 90, 60]; // 使用者自己勾的時長（培訓鎖定時另算 effective=selectedDurs）

function dateMeta(dateKey) {
  const [y,m,d] = dateKey.split('-').map(Number);
  const date = new Date(y, m-1, d);
  const now  = new Date();
  const base = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((date - base) / 86400000);
  const mmdd = `${date.getMonth()+1}月${date.getDate()}日`;
  const wd   = `週${WD[date.getDay()]}`;
  const nearLabel = diff===0?'今日':diff===1?'明天':diff===2?'後天':`${diff}天後`;
  return { mmdd, wd, nearLabel, diff };
}
function todayKey() {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
}
// ── 客立樂 API 資料層（原 worker 邏輯搬到前端）────────────────
function tpeTodayParts() {
  const s = new Intl.DateTimeFormat('en-CA', { timeZone:'Asia/Taipei' }).format(new Date());
  return s.split('-').map(Number); // [y, m, d]
}
function dayStartEpoch() {
  const [y,m,d] = tpeTodayParts();
  return Math.floor(Date.UTC(y, m-1, d, -8, 0, 0) / 1000); // TPE 00:00
}
function dayEndEpoch(days) {
  const [y,m,d] = tpeTodayParts();
  return Math.floor(Date.UTC(y, m-1, d+days, 15, 59, 59) / 1000); // TPE 23:59:59
}
function tsToKey(ts) {
  const s = new Intl.DateTimeFormat('en-CA', {
    timeZone:'Asia/Taipei', year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', hour12:false,
  }).format(new Date(ts * 1000)); // "2026-07-04, 13:00"
  const [dateKey, timeStr] = s.split(', ');
  return { dateKey, timeStr };
}
async function getMenu() {
  const r = await fetch(`${API_BASE}/bookings/menu/service?code=${BOOKING_CODE}`);
  if (!r.ok) throw new Error('menu ' + r.status);
  return (await r.json()).data;
}
function buildCatalog(menu) {
  const users = {};
  for (const u of menu.users || []) users[u.id] = { name:(u.name||'').trim(), avatar:u.avatar||'' };
  const staff = {};
  for (const p of menu.products || []) {
    const pname  = p.name || '';
    const branch = BRANCHES.find(b => pname.startsWith(b));
    if (!branch || pname.includes('不指定') || ![120,90,60].includes(p.duration)) continue;
    const isTraineeProduct = pname.includes('培訓');
    for (const pr of p.providers || []) {
      if (!pr.isProvided) continue;
      const u = users[pr.userId];
      if (!u) continue;
      if (!staff[pr.userId]) staff[pr.userId] = { staffId:pr.userId, name:u.name, avatar:u.avatar, branch, isTrainee:false, jobs:[] };
      const s = staff[pr.userId];
      if (isTraineeProduct) s.isTrainee = true;
      s.jobs.push({ productId:p.id, dur:p.duration, branch });
    }
  }
  return staff;
}
async function fetchSlotCells(productId, userId, startTime, endTime) {
  const r = await fetch(`${API_BASE}/bookings/duration?code=${BOOKING_CODE}`, {
    method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ startTime, endTime, events:[{ productId, addOnIds:[], userId, isAssigned:true }], parallel:false, customerCount:1 }),
  });
  if (!r.ok) return {};
  return (await r.json()).result || {};
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
// 併發上限 + 批間微抖動：把一次爆量攤平成一小段平滑流量（降低被判為爬蟲的機會）
async function runPooled(taskFns, limit, jitter) {
  const results = new Array(taskFns.length);
  let idx = 0;
  async function worker() {
    while (true) {
      const my = idx++;
      if (my >= taskFns.length) break;
      try { results[my] = await taskFns[my](); } catch(e) { results[my] = null; }
      if (jitter) await sleep(jitter[0] + Math.random() * (jitter[1] - jitter[0]));
    }
  }
  await Promise.all(Array.from({ length: Math.min(limit, taskFns.length) }, worker));
  return results;
}
function groupSlots(results, meta, grouped) {
  results.forEach((data, i) => {
    if (!data) return;
    const { s, job } = meta[i];
    for (const k of Object.keys(data)) {
      const info = data[k];
      if (info.status !== 'Available' || !info.cells || !info.cells.length) continue;
      for (const ts of info.cells) {
        const { dateKey, timeStr } = tsToKey(ts);
        const key = `${s.staffId}__${job.branch}__${dateKey}__${timeStr}`;
        if (!grouped[key]) grouped[key] = { teacher:s.name, staffId:s.staffId, avatar:s.avatar, branch:job.branch, time:timeStr, dateKey, durations:[], isTrainee:s.isTrainee };
        if (!grouped[key].durations.includes(job.dur)) grouped[key].durations.push(job.dur);
      }
    }
  });
}
// ── Step 2：分段抓取 helpers ─────────────────────────────────
function offeredDurs(s) { return [...new Set(s.jobs.map(j=>j.dur))].sort((a,b)=>a-b); } // 升冪
function jobFor(s, dur) { return s.jobs.find(j=>j.dur===dur); }
// 該老師「最小的、被選取的、他有做的」時長（用來排序＝找最早）；null=目前時長篩選下他無方案
function rankingDur(s) {
  const sel = offeredDurs(s).filter(d=>selectedDurs.includes(d));
  return sel.length ? sel[0] : null;
}
async function fetchJobWindow(s, job, days) {
  const st = dayStartEpoch(), et = dayEndEpoch(days);
  const data = await fetchSlotCells(job.productId, s.staffId, st, et);
  groupSlots([data], [{ s, job }], GROUPED);
  FETCHED[`${s.staffId}:${job.dur}`] = days;
}
function rebuildSlots() {
  const slots = Object.values(GROUPED);
  slots.forEach(x => x.durations.sort((a,b)=>b-a));
  slots.sort((a,b)=> a.dateKey!==b.dateKey ? (a.dateKey<b.dateKey?-1:1) : (a.time<b.time?-1:1));
  allData.slots = slots;
}
function buildRoster(teachers) {
  const rlist = teachers.map(s => ({ staffId:s.staffId, name:s.name, avatar:s.avatar, branch:s.branch, isTrainee:s.isTrainee }));
  rlist.sort((a,b)=>{
    const bi = BRANCHES.indexOf(a.branch)-BRANCHES.indexOf(b.branch);
    if (bi) return bi;
    if (a.isTrainee!==b.isTrainee) return a.isTrainee?-1:1;
    return a.name<b.name?-1:1;
  });
  return rlist;
}
// 只問「排序用時長」（每位老師最短的被選時長），指定天數、指定老師群
function ensureRanking(days, list) {
  const targets = [];
  for (const s of (list || CATALOG)) {
    const dur = rankingDur(s); if (dur==null) continue;
    if ((FETCHED[`${s.staffId}:${dur}`]||0) >= days) continue;
    targets.push(() => fetchJobWindow(s, jobFor(s,dur), days));
  }
  return targets.length ? runPooled(targets, FETCH_CONCURRENCY, FETCH_JITTER) : Promise.resolve();
}
// 先 7 天，仍完全無空位的老師再延長 14 天；並記錄每位老師資料所在視窗
async function ensureRankingProgressive() {
  await ensureRanking(WINDOW_DAYS_1);
  const has = new Set(Object.values(GROUPED).map(x=>x.staffId));
  const empties = CATALOG.filter(s => rankingDur(s)!=null && !has.has(s.staffId));
  if (empties.length) await ensureRanking(WINDOW_DAYS_2, empties);
  for (const s of CATALOG) {
    const dur = rankingDur(s); if (dur==null) continue;
    teacherDays[s.staffId] = FETCHED[`${s.staffId}:${dur}`] || WINDOW_DAYS_1;
  }
}
// 補齊指定老師們「所有被選時長」的資料（讓卡片時長標籤完整）
function ensurePills(staffIds) {
  const targets = [];
  for (const id of staffIds) {
    const s = CATALOG.find(x=>x.staffId===id); if (!s) continue;
    const days = teacherDays[id] || WINDOW_DAYS_1;
    for (const dur of offeredDurs(s)) {
      if (!selectedDurs.includes(dur)) continue;
      if ((FETCHED[`${id}:${dur}`]||0) >= days) continue;
      targets.push(() => fetchJobWindow(s, jobFor(s,dur), days));
    }
  }
  return targets.length ? runPooled(targets, FETCH_CONCURRENCY, FETCH_JITTER) : Promise.resolve();
}
function readCache() {
  try {
    // 改用 localStorage：同一人幾分鐘內重開／重整都能吃快取、不重抓
    const c = JSON.parse(localStorage.getItem('slotdash_v4') || 'null');
    if (c && Date.now() - c.t < CACHE_TTL_MS) return c.d;
  } catch(e) {}
  return null;
}
function writeCache(d) {
  try { localStorage.setItem('slotdash_v4', JSON.stringify({ t:Date.now(), d })); } catch(e) {}
}
function hashColor(name) {
  let h = 0;
  for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `hsl(${h}, 16%, 44%)`;
}
function bannerBg(slot) {
  return slot.isTrainee ? 'var(--tr-dark)' : (TEACHER_COLOR[slot.teacher] || hashColor(slot.teacher));
}
function staffById(id) { return roster.find(s => s.staffId === id); }

const SCAN_STEPS = [
  {msg:'讀取空檔資料…',   sub:'LOADING',    pct:12},
  {msg:'連線預約系統…',   sub:'CONNECTING', pct:30},
  {msg:'查詢兩分店時段…', sub:'SCANNING',   pct:54},
  {msg:'整理可預約時間…', sub:'ARRANGING',  pct:78},
  {msg:'即將完成…',       sub:'ALMOST',     pct:93},
];
const scanTimers = {};

function showScanning(containerId, statusId) {
  document.getElementById(statusId).innerHTML = '';
  document.getElementById(containerId).innerHTML =
    `<div style="width:100%;display:flex;gap:6px">${skeletonCardHTML()}${skeletonCardHTML()}${skeletonCardHTML()}</div>`;
  const cardRow   = document.getElementById(containerId);
  const parent    = cardRow.parentNode;
  const wrapperId = 'scan-wrapper-' + containerId;
  const overlayId = 'scan-overlay-' + containerId;
  const msgId     = 'scan-msg-'     + containerId;
  const subId     = 'scan-sub-'     + containerId;
  const barId     = 'sbar-'         + containerId;
  const oldWrapper = parent.querySelector('#' + wrapperId);
  if (oldWrapper) oldWrapper.replaceWith(cardRow);
  const wrapper = document.createElement('div');
  wrapper.id = wrapperId;
  wrapper.style.cssText = 'position:relative';
  cardRow.parentNode.insertBefore(wrapper, cardRow);
  wrapper.appendChild(cardRow);
  const overlay = document.createElement('div');
  overlay.id = overlayId;
  overlay.style.cssText = 'position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);z-index:5;min-height:180px;transition:opacity .35s ease';
  overlay.innerHTML = `
    <div class="scan-spin"></div>
    <div style="text-align:center">
      <div id="${msgId}" style="font-size:12px;color:var(--gray);transition:opacity .2s">${SCAN_STEPS[0].msg}</div>
      <div id="${subId}" style="font-family:'DM Mono',monospace;font-size:10px;color:var(--gray3);letter-spacing:.04em;margin-top:2px">${SCAN_STEPS[0].sub}</div>
    </div>
    <div style="width:100px;height:2px;background:var(--bg2);border-radius:2px;overflow:hidden">
      <div id="${barId}" style="height:100%;width:5%;background:var(--clay);border-radius:2px;transition:width 1.8s cubic-bezier(.4,0,.2,1)"></div>
    </div>`;
  wrapper.appendChild(overlay);
  setTimeout(() => { const b=document.getElementById(barId); if(b) b.style.width='10%'; }, 80);
  let step = 0;
  if (scanTimers[containerId]) clearInterval(scanTimers[containerId]);
  scanTimers[containerId] = setInterval(() => {
    step = Math.min(step + 1, SCAN_STEPS.length - 1);
    const s   = SCAN_STEPS[step];
    const msg = document.getElementById(msgId);
    const sub = document.getElementById(subId);
    const bar = document.getElementById(barId);
    if (msg) { msg.style.opacity='0'; setTimeout(()=>{ msg.textContent=s.msg; msg.style.opacity='1'; },180); }
    if (sub) sub.textContent = s.sub;
    if (bar) bar.style.width = s.pct + '%';
  }, 2000);
}
function stopScanning(containerId) {
  if (scanTimers[containerId]) { clearInterval(scanTimers[containerId]); delete scanTimers[containerId]; }
  const overlay = document.getElementById('scan-overlay-' + containerId);
  if (overlay) { overlay.style.opacity='0'; setTimeout(()=>overlay.remove(), 380); }
}

// ── 篩選 ─────────────────────────────────────────────────────
function toggleDur(d) {
  const picks = (currentTab==='staff') ? staffPicked : [];
  const allTrainee = picks.length>0 && picks.every(isTraineeId);
  const hasTrainee = picks.some(isTraineeId);
  if (allTrainee && d !== 120) return; // 純選培訓師：60/90 凍結
  if (hasTrainee && d === 120) return; // 有選到培訓師：120 不可取消（避免培訓師被藏）
  if (userDurs.includes(d) && userDurs.length===1) return; // 至少保留一個時長
  userDurs = userDurs.includes(d) ? userDurs.filter(x=>x!==d) : [...userDurs, d];
  recomputeDurs();
  onFilterChange();
}
function toggleBranch(b) {
  const has = selectedBranches.includes(b);
  if (has && selectedBranches.length===1) return; // 至少保留一間分店
  if (has) {
    selectedBranches = selectedBranches.filter(x=>x!==b);
  } else {
    selectedBranches = [...selectedBranches, b];
    roster.filter(s=>s.branch===b).forEach(s=>todayStaff.add(s.staffId)); // 新開分店的老師預設納入
  }
  // 移除被隱藏分店的老師（今日多選）
  const vis = new Set(visibleRoster().map(s=>s.staffId));
  [...todayStaff].forEach(id=>{ if(!vis.has(id)) todayStaff.delete(id); });
  document.querySelectorAll('.cbx-branch').forEach(el =>
    el.classList.toggle('on', selectedBranches.includes(el.dataset.branch))
  );
  onFilterChange();
}
async function onFilterChange() {
  if (!allData) return;
  const my = ++refreshSeq;
  buildStaffTabs();
  if (currentTab === 'staff') staffPicked = staffPicked.filter(id => visibleRoster().some(s=>s.staffId===id));
  // 先用現有資料立即畫（時長標籤可能暫時不完整）
  rebuildSlots(); renderToday(); if (currentTab==='staff') renderStaff();
  // 改了時長篩選可能需要新的「排序時長」資料 → 補抓
  await ensureRankingProgressive();
  if (my !== refreshSeq) return;
  rebuildSlots(); renderToday(); if (currentTab==='staff') renderStaff();
  // 補齊目前顯示中（今日 3 位＋指定老師所選）的時長標籤
  const ids = [...new Set([...tabSlots.today.map(s=>s.staffId), ...staffPicked])];
  await ensurePills(ids);
  if (my !== refreshSeq) return;
  rebuildSlots(); renderToday(); if (currentTab==='staff') renderStaff();
}
function visibleRoster() {
  return roster.filter(s => selectedBranches.includes(s.branch));
}

function switchTab(id, btn) {
  currentTab = id;
  trackMode(id);
  applyCollapseDefault(id);
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
  document.getElementById('pane-'+id).classList.add('active');
  if (!allData) return;
  if (id === 'today') {
    // 今日 / 最早：膠囊預設全選（多選過濾）
    todayStaff = new Set(visibleRoster().map(s=>s.staffId));
    recomputeDurs(); // 離開指定老師→回到使用者原本的時長
    syncCapsuleSelection();
    renderToday();
  } else {
    // 指定老師：進入時清空選取，等使用者點（可多選最多 3 位）
    staffPicked = [];
    recomputeDurs(); // 清空選取→確保解鎖
    syncCapsuleSelection();
    renderStaff();
  }
}
const _statusTyper  = {}; // elId -> timeout（打字中）
const _statusLast   = {}; // elId -> 上次文字（相同不重播）
const _statusFreeze = {}; // elId -> timeout（打完後定住游標）
function _scheduleCaretFreeze(elId, caret) {
  if (_statusFreeze[elId]) clearTimeout(_statusFreeze[elId]);
  _statusFreeze[elId] = setTimeout(() => { if (caret) caret.classList.add('frozen'); _statusFreeze[elId] = null; }, 1600);
}
function renderStatus(elId, text, color) {
  const el = document.getElementById(elId);
  if (!el) return;
  const same = _statusLast[elId] === text;
  if (same && _statusTyper[elId]) return; // 同文字且正在打字→讓它打完
  if (_statusTyper[elId])  { clearTimeout(_statusTyper[elId]);  _statusTyper[elId]  = null; }
  if (_statusFreeze[elId]) { clearTimeout(_statusFreeze[elId]); _statusFreeze[elId] = null; }
  _statusLast[elId] = text;
  el.innerHTML =
    `<div class="status-dot" style="background:${color}"></div>` +
    `<span class="status-line"><span class="status-text" style="color:${color}"></span><span class="status-caret" style="background:${color}"></span></span>`;
  const span  = el.querySelector('.status-text');
  const caret = el.querySelector('.status-caret');
  if (same) { span.textContent = text; _scheduleCaretFreeze(elId, caret); return; } // 同文字直接顯示
  // 終端機打字機：逐字輸出（速度含人性化抖動），游標先自然閃爍、打完稍後 freeze 定住
  let i = 0;
  const step = () => {
    if (i >= text.length) { _statusTyper[elId] = null; _scheduleCaretFreeze(elId, caret); return; }
    span.textContent += text.charAt(i++);
    _statusTyper[elId] = setTimeout(step, 55 + Math.random() * 70); // 約 55–125ms/字
  };
  step();
}
function branchPrefix() {
  return selectedBranches.length===1 ? `${selectedBranches[0]}｜` : '';
}
function computeTodayStatus(slots) {
  const tk = todayKey();
  const todaySlots = slots.filter(s => s.dateKey === tk);
  if (todaySlots.length === 0) {
    const fut = slots.find(s => s.dateKey !== tk);
    if (!fut) return { text:branchPrefix()+'近期已滿，下月預約 25 日 13:00 開放', color:'var(--red)' };
    return { text:`${branchPrefix()}今日已滿，最早在${dateMeta(fut.dateKey).nearLabel}`, color:'var(--red)' };
  }
  if (todaySlots.length >= 4) return { text:branchPrefix()+'今日尚有多個空位', color:'var(--green)' };
  return { text:`${branchPrefix()}今日剩下${todaySlots.length}個空位`, color:'var(--red)' };
}
function computeStaffStatus(slots, staffName) {
  const tk = todayKey();
  const todayOk = slots.filter(s => s.dateKey === tk);
  if (slots.length === 0) return { text:`${staffName} 近期暫無可預約時段`, color:'var(--red)' };
  if (todayOk.length === 0) {
    const next = slots[0];
    return { text:`今日已滿，${staffName} 最早空位在${dateMeta(next.dateKey).nearLabel}`, color:'var(--red)' };
  }
  return { text:`${staffName} 今日有 ${todayOk.length} 個空位`, color:'var(--green)' };
}

function cardHTML(slot, rank, flipCls, todayFull) {
  if (!slot) return `<div class="card-empty"><div class="card-empty-inner"><div class="card-empty-line"></div></div></div>`;
  const { mmdd, wd, nearLabel, diff } = dateMeta(slot.dateKey);
  const isToday = diff === 0;
  const [,mNum,dNum] = slot.dateKey.split('-').map(Number);
  const mShort = `${mNum}/${dNum}`;
  const avHtml = slot.avatar ? `<img class="card-hd-av" src="${slot.avatar}" loading="lazy" onerror="this.remove()">` : '';
  const durPills = slot.durations.map(d =>
    `<span class="dur-pill ${DUR_CONFIG[d].cls}">${DUR_CONFIG[d].short}</span>`
  ).join('');
  const badgeHTML  = slot.isTrainee ? `<span class="trainee-badge">培訓新師</span>` : '';
  const bcCls      = slot.branch==='南京三民' ? 'bc-nj' : 'bc-zs';
  const branchName = BRANCH_SHORT[slot.branch] || slot.branch;
  return `
  <div class="card">
    <div class="card-inner ${flipCls}" onclick="openSheet(${rank-1})">
      <div class="card-teacher-banner">
        <div class="banner-left">${avHtml}<span class="card-teacher-name">${slot.teacher}</span></div>
        <div class="banner-right">${badgeHTML}</div>
      </div>
      <div class="card-branch-banner ${bcCls}">${branchName}</div>
      <div class="card-body">
        <div class="card-near-row">
          <span class="near-badge ${isToday?'today':'other'}">${nearLabel}</span>
          ${(!isToday&&todayFull)?'<span class="full-badge">今日已滿</span>':''}
        </div>
        <div class="card-when">
          <span class="card-date"><span class="card-mmdd">${mShort}</span><span class="card-wd">${wd}</span></span>
          <span class="card-time">${slot.time}</span>
        </div>
        <div class="card-div"></div>
        <div class="card-durs">${durPills}</div>
      </div>
    </div>
  </div>`;
}
function paintCards(containerId, slots) {
  const tk = todayKey();
  const todayFull = !slots.some(s => s.dateKey === tk);
  const padded = [...slots]; while(padded.length<3) padded.push(null);
  const classes = ['flip-1','flip-2','flip-3'];
  document.getElementById(containerId).innerHTML =
    padded.map((s,i) => cardHTML(s, i+1, classes[i], todayFull)).join('');
}

function setFetchedAt(isoString) {
  const el = document.getElementById('ft-fetched');
  if (!el || !isoString) return;
  const d = new Date(isoString);
  const hhmm = d.toLocaleTimeString('zh-TW', {
    timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', hour12: false
  });
  el.textContent = `資料時間 ${hhmm}`;
}
function applyFilters(slots) {
  return (slots || [])
    .filter(s => s.durations.some(d => selectedDurs.includes(d)))
    .filter(s => selectedBranches.includes(s.branch));
}

// ── 今日 / 最早時段 ──────────────────────────────────────────
function renderToday() {
  const allSlots = applyFilters(allData.slots).filter(s => todayStaff.has(s.staffId));
  const seen = new Set();
  const earliestPerTeacher = allSlots.filter(s => {
    const k = s.staffId || s.teacher;
    if (seen.has(k)) return false;
    seen.add(k);
    return true;
  });
  earliestPerTeacher.sort((a, b) => {
    if (a.dateKey !== b.dateKey) return a.dateKey < b.dateKey ? -1 : 1;
    return a.time < b.time ? -1 : 1;
  });
  const status = computeTodayStatus(earliestPerTeacher);
  renderStatus('status-today', status.text, status.color);
  const label = document.getElementById('label-today');
  const top3 = earliestPerTeacher.slice(0, 3);
  tabSlots.today = top3;
  if (top3.length === 0) {
    if (label) label.textContent = '';
    document.getElementById('cards-today').innerHTML = emptyStateHTML();
    return;
  }
  if (label) label.textContent = `最早可約 · ${top3.length} 位老師`;
  paintCards('cards-today', top3);
}

// ── 培訓新師時長鎖定 ─────────────────────────────────────────
function isTraineeId(id) { const s = roster.find(x => x.staffId === id); return !!(s && s.isTrainee); }
function recomputeDurs() {
  const picks = (currentTab==='staff') ? staffPicked : [];
  const allTrainee = picks.length>0 && picks.every(isTraineeId);
  const hasTrainee = picks.some(isTraineeId);
  if (allTrainee)      selectedDurs = [120];                            // 純選培訓師：只 120
  else if (hasTrainee) selectedDurs = [...new Set([...userDurs, 120])]; // 混選：保底 120、其餘照使用者
  else                 selectedDurs = userDurs.slice();
  [120,90,60].forEach(x => {
    const el = document.getElementById('pill-'+x); if (!el) return;
    el.classList.toggle('on', selectedDurs.includes(x));
    el.classList.toggle('cbx-locked', allTrainee && x !== 120);        // 只有純選培訓師才凍結 60/90
  });
}
// 指定老師：改動後補資料再渲染（防過時渲染）
async function refreshStaff() {
  const my = ++refreshSeq;
  renderStaff();
  await ensureRankingProgressive();
  if (my !== refreshSeq || currentTab !== 'staff') return;
  rebuildSlots(); renderStaff();
  await ensurePills(staffPicked.slice());
  if (my !== refreshSeq || currentTab !== 'staff') return;
  rebuildSlots(); renderStaff();
}
// ── 老師膠囊：兩模式共用同一列 ────────────────────────────────
function onStaffCapsule(staffId) {
  if (currentTab === 'today') {
    // 今日 / 最早：多選過濾（至少保留一位）
    if (todayStaff.has(staffId)) {
      if (todayStaff.size > 1) todayStaff.delete(staffId);
    } else {
      todayStaff.add(staffId);
    }
    syncCapsuleSelection();
    renderToday();
  } else {
    // 指定老師：多選，最多 3 位（滿了再點新的就把最早選的擠掉）
    const i = staffPicked.indexOf(staffId);
    if (i >= 0) staffPicked.splice(i, 1);
    else { staffPicked.push(staffId); if (staffPicked.length > 3) staffPicked.shift(); sbTrack('staff:'+staffId); }
    recomputeDurs(); // 依所選（純培訓/混選）重算時長鎖定
    syncCapsuleSelection();
    const el = document.querySelector(`#staff-tabs .stab[data-sid="${staffId}"]`);
    if (el) el.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
    refreshStaff();
  }
}
function syncCapsuleSelection() {
  document.querySelectorAll('#staff-tabs .stab').forEach(b => {
    const sid = b.dataset.sid;
    const on = currentTab==='today' ? todayStaff.has(sid) : staffPicked.includes(sid);
    b.classList.toggle('active', on);
  });
}
function renderStaff() {
  const label = document.getElementById('label-staff');
  if (staffPicked.length === 0) {
    renderStatus('status-staff', '請點選老師（可多選最多 3 位）', 'var(--gray)');
    if (label) label.textContent = '';
    tabSlots.staff = [];
    paintCards('cards-staff', []); // 顯示虛線空卡片，不重複文字
    return;
  }
  const durOk = x => x.durations.some(d => selectedDurs.includes(d));
  const pool = allData.slots
    .filter(x => staffPicked.includes(x.staffId) && durOk(x))
    .sort((a,b) => a.dateKey!==b.dateKey ? (a.dateKey<b.dateKey?-1:1) : (a.time<b.time?-1:1));
  // 先讓每位所選老師至少出現最早一筆，名額未滿再用最早的往下補，最多 3 張
  const chosen = [], seen = new Set();
  for (const x of pool) { if (!seen.has(x.staffId)) { chosen.push(x); seen.add(x.staffId); } if (chosen.length>=3) break; }
  if (chosen.length < 3) { for (const x of pool) { if (chosen.indexOf(x)>=0) continue; chosen.push(x); if (chosen.length>=3) break; } }
  chosen.sort((a,b) => a.dateKey!==b.dateKey ? (a.dateKey<b.dateKey?-1:1) : (a.time<b.time?-1:1));
  const tk = todayKey();
  const todayN = pool.filter(x => x.dateKey===tk).length;
  let status;
  if (pool.length === 0)  status = { text:'近期已滿，下月預約 25 日 13:00 開放', color:'var(--red)' };
  else if (todayN === 0)  status = { text:`今日已滿，最早在${dateMeta(pool[0].dateKey).nearLabel}`, color:'var(--red)' };
  else if (todayN >= 4)   status = { text:'今日尚有多個空位', color:'var(--green)' };
  else                    status = { text:`今日剩下${todayN}個空位`, color:'var(--red)' };
  renderStatus('status-staff', status.text, status.color);
  tabSlots.staff = chosen;
  if (chosen.length === 0) {
    if (label) label.textContent = '';
    document.getElementById('cards-staff').innerHTML = emptyStateHTML();
    return;
  }
  if (label) label.textContent = `已選 ${staffPicked.length} 位 · 最早 ${chosen.length} 筆`;
  paintCards('cards-staff', chosen);
}

const collapsedBranches = new Set(['南京三民','中山']); // 今日模式預設全部疊合；指定老師模式進入時展開
function applyCollapseDefault(tab) {
  collapsedBranches.clear();
  if (tab === 'today') ['南京三民','中山'].forEach(b => collapsedBranches.add(b));
  document.querySelectorAll('#staff-tabs .stab-group').forEach(g =>
    g.classList.toggle('collapsed', collapsedBranches.has(g.dataset.branch)));
}
function buildStaffTabs() {
  const wrap = document.getElementById('staff-tabs');
  wrap.innerHTML = '';
  const branches = ['南京三民','中山'].filter(b => selectedBranches.includes(b));
  let addedAny = false;
  branches.forEach(b => {
    const members = roster.filter(s => s.branch === b);
    if (!members.length) return;
    if (addedAny) {
      const divider = document.createElement('div');
      divider.className = 'stab-divider';
      wrap.appendChild(divider);
    }
    const group = document.createElement('div');
    group.className = 'stab-group' + (collapsedBranches.has(b) ? ' collapsed' : '');
    group.dataset.branch = b;

    const label = document.createElement('button');
    label.className = 'stab-group-label';
    label.type = 'button';
    label.setAttribute('aria-label', b + '（點按收合或展開）');
    label.appendChild(document.createTextNode(b));
    const facepile = document.createElement('span');
    facepile.className = 'stab-facepile';
    facepile.setAttribute('aria-hidden','true');
    members.forEach(s => {
      if (!s.avatar) return;
      const mi = document.createElement('img');
      mi.src = s.avatar;
      mi.loading = 'lazy';
      mi.onerror = function(){ this.remove(); };
      facepile.appendChild(mi);
    });
    label.appendChild(facepile);
    const count = document.createElement('span');
    count.className = 'stab-group-count';
    count.textContent = members.length;
    label.appendChild(count);
    label.onclick = () => {
      const nowCollapsed = group.classList.toggle('collapsed');
      if (nowCollapsed) collapsedBranches.add(b); else collapsedBranches.delete(b);
    };
    group.appendChild(label);

    const pills = document.createElement('div');
    pills.className = 'stab-group-pills';
    const pillsInner = document.createElement('div');
    pillsInner.className = 'stab-pills-inner';
    members.forEach(s => {
      const btn = document.createElement('button');
      btn.className = 'stab' + (s.isTrainee ? ' tr-pill' : '');
      btn.dataset.sid = s.staffId;
      const av = document.createElement('img');
      av.className = 'stab-av';
      av.src = s.avatar || '';
      av.loading = 'lazy';
      av.onerror = function(){ this.remove(); };
      btn.appendChild(av);
      btn.appendChild(document.createTextNode(s.name));
      if (s.isTrainee) { const tg = document.createElement('span'); tg.className = 'stab-tr-tag'; tg.textContent = '培訓新師'; btn.appendChild(tg); }
      btn.onclick = () => onStaffCapsule(s.staffId);
      pillsInner.appendChild(btn);
    });
    pills.appendChild(pillsInner);
    group.appendChild(pills);
    wrap.appendChild(group);
    addedAny = true;
  });
  syncCapsuleSelection();
}

// ── 免責 / 前往預約 ──────────────────────────────────────────
function openSheet(slotIndex) {
  const wrap  = document.getElementById('slot-summary-wrap');
  const body  = document.getElementById('sheet-body');
  const btn   = document.getElementById('sheet-btn');
  const slots = tabSlots[currentTab] || [];
  sheetSlot = (slotIndex !== null && slots[slotIndex]) ? slots[slotIndex] : null;

  if (sheetSlot) {
    const slot = sheetSlot;
    const { mmdd, wd, nearLabel } = dateMeta(slot.dateKey);
    const pills = slot.durations.map(d =>
      `<span class="slot-dur-pill ${DUR_CONFIG[d].cls}">${DUR_CONFIG[d].short}</span>`
    ).join('');
    const traineeBadge = slot.isTrainee
      ? `<span class="slot-trainee-badge">培訓新師</span>` : '';
    const bcCls  = slot.branch === '南京三民' ? 'bc-nj' : 'bc-zs';
    const mapUrl = BRANCH_MAP[slot.branch] || '';
    const [,mN,dN] = slot.dateKey.split('-').map(Number);
    const dShort = `${mN}/${dN}`;
    const avImg = slot.avatar ? `<img class="slot-av" src="${slot.avatar}" onerror="this.remove()">` : '';
    const extSvg = `<svg class="ext" width="8" height="8" viewBox="0 0 8 8" fill="none"><path d="M2.6 1H7v4.4M7 1 1 7" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    const branchLink = mapUrl
      ? `<a class="slot-branch-link ${bcCls}" href="${mapUrl}" onclick="return openMap('${mapUrl}')">${slot.branch}${extSvg}</a>`
      : `<span class="slot-branch-plain">${slot.branch}</span>`;
    wrap.innerHTML = `
      <div class="slot-summary">
        <div class="slot-timecol">
          <span class="slot-time-big">${slot.time}</span>
          ${branchLink}
        </div>
        <div class="slot-div"></div>
        <div class="slot-meta">
          <div class="slot-meta-name">${avImg}${slot.teacher}${traineeBadge}</div>
          <div class="slot-meta-date">${nearLabel}　${dShort}　${wd}</div>
        </div>
        <div class="slot-dur-pills">${pills}</div>
      </div>`;
    body.innerHTML =
      `本工具僅供查詢，<b>未與預約系統連動</b>。點下方按鈕會開啟 <b>${slot.teacher}</b> 的專屬預約頁（老師已選好），` +
      `請記下<b>日期與時段</b>，進入後選擇方案與時間即可完成預約。實際空位以預約系統為準。`;
    btn.textContent = `前往預約（已選 ${slot.teacher}）`;
  } else {
    wrap.innerHTML = '';
    body.innerHTML =
      `本工具僅供查詢，<b>未與預約系統連動</b>。請點下方按鈕前往預約系統完成預約，實際空位以預約系統為準。`;
    btn.textContent = '前往預約系統';
  }
  document.getElementById('mask').classList.add('show');
}
function openMap(url) {
  // 一律用外部瀏覽器開啟（LINE 內用 liff 外開，否則開新分頁）
  try {
    if (typeof liff !== 'undefined' && liff.isInClient && liff.isInClient()) liff.openWindow({ url, external:true });
    else window.open(url, '_blank', 'noopener');
  } catch(e) { window.open(url, '_blank', 'noopener'); }
  return false;
}
function closeSheet() { document.getElementById('mask').classList.remove('show'); }
function handleMaskClick(e) { if(e.target.id==='mask') closeSheet(); }

// ── 開放提醒（加入行事曆）──────────────────────────────────────
const BELL = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>';
// 下一次開放時間＝最近的未來「某月 25 日 13:00」（過了本月 25 日 13:00 就算下個月）
function nextReleaseDate() {
  const now = new Date();
  let d = new Date(now.getFullYear(), now.getMonth(), 25, 13, 0, 0, 0);
  if (now.getTime() >= d.getTime()) d = new Date(now.getFullYear(), now.getMonth()+1, 25, 13, 0, 0, 0);
  return d;
}
function releaseLabel(d) {
  const wd = ['日','一','二','三','四','五','六'][d.getDay()];
  return `${d.getMonth()+1}/25（${wd}）13:00`;
}
// 靜態每月循環 .ics（LINE 內強制外開 Safari 才能穩定跳「加入行事曆」；桌面直接開）
function addReminder() {
  sbTrack('remind');
  const url = new URL('remind.ics', location.href).href;
  try {
    if (typeof liff !== 'undefined' && liff.isInClient && liff.isInClient()) liff.openWindow({ url, external:true });
    else window.open(url, '_blank');
  } catch(e) { window.open(url, '_blank'); }
}
function goBooking() {
  closeSheet();
  sbTrack('convert');
  const url = (sheetSlot && sheetSlot.staffId)
    ? `${LIFF_BOOKING}/${sheetSlot.staffId}/store`
    : `${LIFF_BOOKING}/menu`;
  if (typeof liff !== 'undefined' && liff.isInClient()) liff.openWindow({ url, external:false });
  else location.href = url;
}
// 標題列「預約系統」連結：開客立樂預約總頁（LINE 內 in-client 開，否則新分頁）
function openBooking() {
  sbTrack('convert');
  const url = `${LIFF_BOOKING}/menu`;
  try {
    if (typeof liff !== 'undefined' && liff.isInClient && liff.isInClient()) liff.openWindow({ url, external:false });
    else window.open(url, '_blank', 'noopener');
  } catch(e) { window.open(url, '_blank', 'noopener'); }
  return false;
}

async function init() {
  if (typeof liff !== 'undefined') { liff.init({ liffId: LIFF_ID }).catch(() => {}); }
  trackVisit(); trackMode('today');
  showScanning('cards-today', 'status-today');
  showScanning('cards-staff', 'status-staff');
  try {
    const menu = await getMenu();
    CATALOG = Object.values(buildCatalog(menu));
    roster  = buildRoster(CATALOG);
    allData = { slots: [], roster, fetchedAt: null };
    const cached = readCache(); // { g, f, dd }
    if (cached) { GROUPED = cached.g || {}; FETCHED = cached.f || {}; teacherDays = cached.dd || {}; }
    todayStaff = new Set(visibleRoster().map(s=>s.staffId)); // 今日模式預設全選
    buildStaffTabs(); // 需在 todayStaff 設好後才建，膠囊才會標成已選
    // 第一階段：排序資料（每位老師最短被選時長，7→14），仍在載入遮罩下
    await ensureRankingProgressive();
    rebuildSlots();
    renderToday();
    renderStaff();
    // 第二階段：補「今日/最早」顯示中 3 位的時長標籤
    await ensurePills(tabSlots.today.map(s=>s.staffId));
    rebuildSlots();
    renderToday();
    stopScanning('cards-today');
    stopScanning('cards-staff');
    allData.fetchedAt = new Date().toISOString();
    setFetchedAt(allData.fetchedAt);
    writeCache({ g:GROUPED, f:FETCHED, dd:teacherDays });
  } catch(e) {
    stopScanning('cards-today');
    stopScanning('cards-staff');
    renderStatus('status-today', '暫時連不上預約系統，請稍後再試', 'var(--red)');
    renderStatus('status-staff', '暫時連不上預約系統，請稍後再試', 'var(--red)');
    const failHTML = `<div style="width:100%;padding:22px 14px;text-align:center;font-size:12px;color:var(--gray);line-height:1.7">暫時取得不到資料，請稍後再開一次</div>`;
    document.getElementById('cards-today').innerHTML = failHTML;
    document.getElementById('cards-staff').innerHTML = failHTML;
  }
}

function sbTrack(metric) {
  try {
    fetch(SB_URL + '/rest/v1/rpc/track_stat', { method:'POST', keepalive:true,
      headers:{ 'apikey':SB_KEY, 'Authorization':'Bearer '+SB_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ p_metric: metric }) }).catch(()=>{});
  } catch(e) {}
}
function trackVisit() {
  try {
    const today = new Date().toLocaleDateString('en-CA', { timeZone:'Asia/Taipei' });
    if (localStorage.getItem('stats_lastDay') !== today) { sbTrack('visit'); localStorage.setItem('stats_lastDay', today); }
    if (!localStorage.getItem('stats_seen')) { sbTrack('visit_new'); localStorage.setItem('stats_seen','1'); }
  } catch(e) { sbTrack('visit'); }
}
function trackMode(tab) {
  const k = 'stats_mode_' + tab;
  try { if (sessionStorage.getItem(k)) return; sessionStorage.setItem(k,'1'); } catch(e) {}
  sbTrack(tab === 'staff' ? 'mode_staff' : 'mode_today');
}

function closeStats() { const m = document.getElementById('stats-mask'); if (m) m.classList.remove('show'); }
function renderStatsBody(s) {
  const p4 = x => String(x ?? 0).padStart(4,'0');
  const p3 = x => String(x ?? 0).padStart(3,'0');
  document.getElementById('stx-body').innerHTML =
    `<div class="stx-visitors">` +

    `</div>` +
    `<div class="stx-row"><span class="k">點擊「指定老師」頁面人數</span><span class="v">今日 ${p3(s.staffpage_today)}<i> ／ 累計 ${p3(s.staffpage_total)}</i></span></div>` +
    `<div class="stx-row"><span class="k">點擊「前往預約」人數</span><span class="v">今日 ${p3(s.convert_today)}<i> ／ 累計 ${p3(s.convert_total)}</i></span></div>` +
    `<div class="stx-faint">` +
      `<div class="stx-frow"><span class="k">今日新進訪客</span><span class="v">${p4(s.new_today)}</span></div>` +
      `<div class="stx-frow"><span class="k">點擊「加入開放提醒」人數</span><span class="v">今日 ${p3(s.remind_today)}／累計 ${p3(s.remind_total)}</span></div>` +
    `</div>` +
    `<div class="stx-admin" id="stx-admin"><a onclick="showStatsPw()">管理員</a></div>` +
    `<div class="stx-pw" id="stx-pw"><input id="stx-pwin" type="password" inputmode="numeric" placeholder="管理員密碼" onkeydown="if(event.key==='Enter')tryStatsPw()"><button onclick="tryStatsPw()">解鎖</button></div>` +
    `<div class="stx-rank" id="stx-rank"></div>`;
}
function showStatsPw() {
  const a = document.getElementById('stx-admin'), p = document.getElementById('stx-pw');
  if (a) a.style.display = 'none';
  if (p) { p.classList.add('show'); const i = document.getElementById('stx-pwin'); if (i) i.focus(); }
}
function tryStatsPw() {
  const i = document.getElementById('stx-pwin'); if (!i) return;
  if (i.value === '88618861') { document.getElementById('stx-pw').classList.remove('show'); renderStatsRank(); }
  else { i.value = ''; i.placeholder = '密碼錯誤，再試'; }
}
// 各老師點擊排行＝就地在同一張卡片展開（單欄；卡片 max-height 88% 可下滑）
function renderStatsRank() {
  const rank = (_statsData && _statsData.staff_rank) || {};
  const p2 = x => String(x ?? 0).padStart(2,'0');
  const p3 = x => String(x ?? 0).padStart(3,'0');
  const src = (roster && roster.length) ? roster : (CATALOG || []);
  const rows = src.map(s => {
    const r = rank[s.staffId] || {};
    return { name: s.name, t: r.t || 0, a: r.a || 0 };
  }).sort((x,y) => (y.a - x.a) || (y.t - x.t));
  let html = `<div class="stx-rank-t">指定老師 · 各老師被點次數（今日／累計）</div>`;
  if (rows.length === 0) html += `<div class="stx-rk"><span class="nm">尚無資料</span></div>`;
  rows.forEach((r,i) => { html += `<div class="stx-rk"><span class="nm"><b>${i+1}</b>${r.name}</span><span class="c">今${p2(r.t)}<i> ／ 累${p3(r.a)}</i></span></div>`; });
  const el = document.getElementById('stx-rank'); el.innerHTML = html; el.classList.add('show');
}
